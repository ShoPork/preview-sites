<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Preview</title>
<script>
  // The previews are single-page apps. A refresh on a page inside one lands here,
  // so send the visitor back to that app's start page, or to the list if there is no such app.
  var parts = location.pathname.split('/').filter(Boolean);
  var site = '/' + (parts[0] || '') + '/';
  location.replace(parts.length > 2 ? site + parts[1] + '/' : site);
</script>
</head>
<body></body>
</html>
